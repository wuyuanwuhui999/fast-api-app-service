<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>中国地图 - ECharts 突出省份</title>
    <!-- 引入 ECharts 核心库 (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0f8ff; /* 极浅的蓝色背景，与地图背景呼应 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 12px;
        }
        #map-container {
            width: 100%;
            max-width: 1100px;
            height: 0;
            padding-bottom: 75%; /* 宽高比 ≈ 4:3，自适应 */
            position: relative;
            background: #d9ecff; /* 浅蓝色背景 (与地图背景一致) */
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 20, 40, 0.15);
            transition: all 0.2s ease;
        }
        #map-chart {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: transparent;
        }
        /* 移动端适配小提示（无额外样式） */
        @media (max-width: 600px) {
            #map-container {
                padding-bottom: 90%; /* 更方一些，适应小屏 */
            }
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map-chart"></div>
    </div>

    <script>
        (function() {
            // 1. 初始化 ECharts 实例
            const chartDom = document.getElementById('map-chart');
            const myChart = echarts.init(chartDom, null, {
                renderer: 'canvas' // 使用 canvas 保证移动端流畅
            });

            // 2. 中国地图 GeoJSON (从 CDN 获取)
            // 使用可靠的 CDN 源，带省份经纬度边界
            const geoUrl = 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json';

            // 3. 配置项 (先设置空数据，等地图加载后填充)
            let option = {
                // 背景色透明，由容器背景显示浅蓝色
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(255, 255, 255, 0.9)',
                    borderColor: '#1e5f8e',
                    borderWidth: 1,
                    padding: [10, 14],
                    textStyle: {
                        color: '#1a2a3a',
                        fontSize: 13,
                        fontWeight: '500'
                    },
                    formatter: function(params) {
                        // 点击/悬浮显示省份信息 (省份名称 + 数值占位)
                        if (!params.data) return '暂无数据';
                        const name = params.name || '未知省份';
                        // 为了演示，显示省份名称及一段描述 (若需要可扩展)
                        return `<strong>${name}</strong><br/>省份代码: ${params.data.code || '--'}`;
                    }
                },
                // 视觉缩放/移动 (移动端手势支持)
                dataZoom: {
                    type: 'inside',    // 内置滑动缩放
                    start: 0,
                    end: 100,
                    minSpan: 10,
                    maxSpan: 100,
                    zoomOnMouseWheel: true,   // PC鼠标滚轮缩放
                    moveOnMouseMove: true,
                    preventDefaultMouseMove: false
                },
                series: [{
                    name: '中国地图',
                    type: 'map',
                    map: 'china',          // 地图名称，需与注册名称一致
                    roam: true,            // 启用缩放和平移 (PC/移动端)
                    selectedMode: false,   // 不开启多选
                    label: {
                        show: false,       // 默认不显示所有省份名称
                        color: '#1a2a3a',
                        fontSize: 11,
                        fontWeight: '500',
                        textBorderColor: 'rgba(255,255,255,0.6)',
                        textBorderWidth: 1
                    },
                    itemStyle: {
                        borderColor: '#ffffff',   // 省份边界白色
                        borderWidth: 1.5,
                        areaColor: '#b3d9ff',     // 默认省份背景 (浅蓝)
                        shadowBlur: 4,
                        shadowColor: 'rgba(0, 20, 40, 0.08)'
                    },
                    emphasis: {
                        label: {
                            show: true,          // 鼠标经过/点击显示名称
                            color: '#0a1a2a',
                            fontSize: 13,
                            fontWeight: '600',
                            textShadowBlur: 4,
                            textShadowColor: 'rgba(255,255,255,0.7)'
                        },
                        itemStyle: {
                            areaColor: '#1f4f7a',   // 鼠标经过深蓝色背景 (#1f4f7a 类似深蓝)
                            borderColor: '#ffffff',
                            borderWidth: 2,
                            shadowBlur: 10,
                            shadowColor: 'rgba(0, 20, 50, 0.3)'
                        }
                    },
                    // 数据：为了突出省份，使用 visualMap 或直接设置样式。
                    // 但由于我们需要指定特定省份深蓝背景，通过 data 中的 itemStyle 来实现
                    data: []
                }]
            };

            // 4. 定义需要突出显示的省份名称列表 (广东、上海、江苏、安徽)
            const highlightProvinces = ['广东省', '上海市', '江苏省', '安徽省'];

            // 5. 加载地图数据并渲染
            fetch(geoUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('地图数据加载失败: ' + response.status);
                    }
                    return response.json();
                })
                .then(geoJson => {
                    // 注册地图
                    echarts.registerMap('china', geoJson);

                    // 获取所有省份名称 (用于构建数据)
                    const features = geoJson.features;
                    const provinceNames = features.map(f => f.properties.name || f.properties.NAME || '').filter(Boolean);

                    // 构建 series.data 数组：每个省份配置背景色，并控制名称显示
                    const seriesData = provinceNames.map(name => {
                        // 判断是否属于突出省份 (深蓝色背景)
                        const isHighlight = highlightProvinces.includes(name);
                        // 基础数据项
                        const dataItem = {
                            name: name,
                            // 自定义属性，用于 tooltip 显示省份代码 (此处取 id 或 adcode)
                            code: features.find(f => (f.properties.name === name || f.properties.NAME === name))?.properties?.adcode || '--',
                            // 默认样式 (浅蓝)
                            itemStyle: {
                                areaColor: isHighlight ? '#1f4f7a' : '#b3d9ff', // 突出省份深蓝，其他浅蓝
                                borderColor: '#ffffff',
                                borderWidth: 1.5
                            },
                            // 标签：只对突出省份显示名称，其他不显示 (通过 label.show 控制)
                            label: {
                                show: isHighlight ? true : false,
                                color: '#ffffff',       // 深蓝背景上文字白色
                                fontSize: 13,
                                fontWeight: '600',
                                textShadowBlur: 2,
                                textShadowColor: 'rgba(0,0,0,0.3)'
                            }
                        };
                        return dataItem;
                    });

                    // 更新 series 数据
                    option.series[0].data = seriesData;

                    // 额外：为了强调鼠标经过深蓝色，已经通过 emphasis.itemStyle.areaColor 设定
                    // 点击弹窗：使用 tooltip 默认即可

                    // 设置 option 并渲染
                    myChart.setOption(option);

                    // 强制刷新以适应容器
                    myChart.resize();

                    // 监听窗口变化自适应 (移动端/PC)
                    window.addEventListener('resize', () => {
                        myChart.resize();
                    });

                    // 移动端手势缩放已由 dataZoom.inside 和 roam:true 支持
                    // 额外: 监听点击事件 (点击省份弹出信息)
                    myChart.on('click', function(params) {
                        if (params.componentType === 'series' && params.data) {
                            const name = params.name || '未知省份';
                            const code = params.data.code || '--';
                            // 弹出省份信息 (使用 alert 或自定义弹窗，这里用 alert 简单演示)
                            alert(`📍 省份: ${name}\n🏷️ 代码: ${code}\n(点击事件触发)`);
                        }
                    });

                    // 为了更好体验：主动触发一次 resize 确保比例
                    setTimeout(() => myChart.resize(), 100);

                })
                .catch(error => {
                    console.error('加载地图数据出错:', error);
                    // 显示错误提示 (简易)
                    chartDom.innerHTML = `
                        <div style="display:flex; justify-content:center; align-items:center; height:100%; background:#d9ecff; color:#1f4f7a; font-size:18px; padding:20px; text-align:center; border-radius:20px;">
                            <div>
                                <p style="font-weight:600; margin-bottom:10px;">⚠️ 地图加载失败</p>
                                <p style="font-size:14px; color:#3a5f7a;">请检查网络或刷新后重试<br>${error.message}</p>
                            </div>
                        </div>
                    `;
                });

            // 6. 辅助：手动设置移动端缩放 (已由 dataZoom + roam 实现)
            // 额外优化：如果移动端双击缩放，ECharts 默认支持

            // 7. 在移动端，容器尺寸自适应
            // 使用 padding-bottom 方案，但 resize 时需重新调整
            // 已经包含 window resize 监听

            console.log('中国地图初始化完成，突出省份: 广东、上海、江苏、安徽');
        })();
    </script>

</body>
</html>
